
    <!DOCTYPE html>
    <html>

    <head>
        <h1>BEAR</h1>
        <style>
            body {
                margin: 0;
                background: linear-gradient(#87ceeb, #bfe9ff);
                font-family: sans-serif;
                text-align: center;
                overflow: hidden;
            }

            h2.subtitle {

                margin-top: 5px;
                font-weight: normal;
                font: Arial, Helvetica, sans-serif;
                font-weight: bold;
                font-size: 16px;
                color: #333;

            }
            canvas {

                background: #7ec850ad;
                grid: 1%;
                display: block;
                margin: 10px auto;
                border: 3px solid #222;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            }



            #ui {
                color: black;
                font-size: 18px;
            }

            #startScreen {

                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.7);
                color: white;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;


            }

            button {
                padding: 10px 20px;
                font-size: 18px;
                font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
                margin: 10px;
                cursor: pointer;
            }

            #controls {

                position: absolute;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
                z-index: 5;

            }

            .middleRow {
                display:flex;
                gap: 50px;
            }

            #controls button {
                width: 60px;
                height: 60px;
                font-size: 24px;
                border-radius: 24px;
                border: none;
                background: rgba(0,0,0,0.4);
                color: white;
                cursor: pointer;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3)
            }

            #controls button:active {

                background: #55555500;
                transform: scale(0.6);
            }

            .btn {

                padding: 15px;
                margin: 5px;
                font-weight: 1px;
                font-family: Arial, Helvetica, sans-serif;
                font-size: 20px;

            }

            .btn {

                width: 60px;
                height: 60px;
                font-size: 24px;
                border-radius: 12px;
                border: none;
                background: #222;
                color: white;
                cursor: pointer;
                transition: 0.1s;
            }

            .btn:active {
                transform: scale(0.6);
                background: #555;
            }

            .btn {
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            }

            #startScreen {
                position: absolute;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.5);
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                z-index: 10;
            }

            #startScreen button {

                padding: 12px 25px;
                font-size: 18px;
                border: none;
                border-radius: 10px;
                cursor: pointer;
                background: #2ecc71;
                color:white;
            }

            #startScreen button:hover {
                background: #27ee60;
            }

           #gameOverScreen {

            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background: rgba(0,0,0,0.8);
            color: white;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            z-index: 20;

           }
           
           #gameOverScreen button {

            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            color: white;
            background: #e74c3c;
           }

            canvas {
                display:block;
            }
        </style>
    </head>

    <body>

        <h2> A Snake Inspired Game, with Bears and Honey! Hope you enjoy!</h2>
        <p><b>Use Arrow Keys or Buttons to play!</p></b>
        <div id="ui">Score: 0 | High Score: 0</div>
        
        <div id="startScreen">
         <h1> Welcome to BEAR </h1>
            <p><b>Use arrow keys or buttons to move. Collect honey, avoid danger!</p></b>
            <button onclick="startGame()"> Start Game</button>
        </div>

        <canvas id="game" width="600" height="400"></canvas>

        <div id="gameOverScreen" style="display:none;">

            <h1> GAME OVER! </h1>
            <p id="finalScore"></p>
            <button onclick="restartGame()">Play Again</button>
        </div>

        <div id="controls">

            <button onclick="setDir('UP')">↑</button>

            <div class="middleRow">

                <button onclick="setDir('LEFT')">←</button>
                <button onclick="setDir('RIGHT')">→</button>

            </div>

            <button onclick="setDir('DOWN')">↓</button>

        </div>




        <script>

            let lastMoveTime = 0;
            const HoneyImg = new Image ();
            HoneyImg.src = "honey1.png";
            const canvas = document.getElementById("game");
            const bearImg = new Image();
            bearImg.src = "bear1remove.png";
            let bearReady = false
            bearImg.onload = () => {
                bearReady= true
            };
            const ctx = canvas.getContext("2d");
            let nextDirection = "RIGHT";
            let box = 20;
            let bear = [
                { x: 200, y: 200}
            ];
            let direction = "RIGHT";
            let honey;
            let score;
            let game;
            let particles = [];
            let running = false;
            let fallingItems = [];

            let highScore = localStorage.getItem("bearHigh") || 0;
            document.getElementById("ui").innerHTML = "Score: 0 | High Score: " + highScore;

            function reset() {
                bear = [{ x: 200, y: 200 }]
                direction = "RIGHT";
                honey = spawn();
                score = 0;
                particles = [];
            }

            function spawn() {
                return {
                    x: Math.floor(Math.random() * 30) * box,
                    y: Math.floor(Math.random() * 20) * box
                };
            }

            function setDir(d) {

                if (d === "LEFT" && direction !== "RIGHT") nextDirection = d;
                if (d === "RIGHT" && direction !== "LEFT") nextDirection = d;
                if (d === "UP" && direction !== "DOWN") nextDirection = d;
                if (d === "DOWN" && direction !== "UP") nextDirection = d;
            }

            window.addEventListener("keydown", e => {
                if (e.key == "ArrowLeft") {
                    e.preventDefault();
                    setDir("LEFT");
                }
                if (e.key == "ArrowUp") { 
                    e.preventDefault();
                    setDir("UP");
                }
                if (e.key == "ArrowRight") {
                    e.preventDefault();
                    setDir("RIGHT");
                }
                if (e.key == "ArrowDown") {
                    e.preventDefault();
                    setDir("DOWN");
                }
            });

            function pointNoise() {
                let ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
                let osc = ctxAudio.createOscillator();
                osc.connect(ctxAudio.destination);
                osc.start();
                osc.stop(ctxAudio.currentTime + 0.1);

            }

            function particle(x, y) {
                for (let i = 0; i < 6; i++) {
                    particles.push({ x: x, y: y, vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4, life: 20 })
                }
            }

            function drawParticles() {
                for (let i = 0; i < particles.length; i++) {
                    let p = particles[i];
                    ctx.fillStyle = "yellow";
                    ctx.fillRect(p.x, p.y, 4, 5)
                    p.x+=p.vx;
                    p.y+=p.vy;
                    p.life--;
                    if(p.life<=0){particles.splice(i,1); i--;}

                }
            }

            function collision(h, arr){
                return arr.some(s => s.x == h.x && s.y == h.y);
            }

            function draw() {

                if(!running) return;

               for (let x = 0; x < 600; x+= box) {
                    for (let y = 0; y < 400; y+= box) {
                        if ((x / box + y / box) % 2 === 0) {

                            ctx.fillStyle = "#7ec850";
                        } else {
                            ctx.fillStyle = "#74b843"
                        }
                        ctx.fillRect(x, y, box, box);
                    }
                }
            
                ctx.fillStyle="gold";
                ctx.fillRect(honey.x,honey.y,box,box);
                ctx.drawImage(HoneyImg, honey.x, honey.y, box, box);
                
                for(let i=0; i < bear.length;i++){
                    if (i === 0 && bearReady) {
                        ctx.drawImage(bearImg, bear[i].x, bear[i].y, box, box);
                    } else {
                        ctx.fillStyle = "#8b5a2b";
                        ctx.fillRect(bear[i].x, bear[i].y, box, box);
                    }
                }

                drawParticles();

                let head = { x: bear[0].x, y: bear[0].y };
                direction = nextDirection;

                if(direction=="LEFT") head.x-=box;
                if(direction=="RIGHT") head.x+=box;
                if(direction=="UP") head.y-=box;
                if(direction=="DOWN") head.y+=box;


               if (head.x === honey.x && head.y === honey.y) {
                score++;
                honey = spawn();
                particle(head.x, head.y);
                pointNoise();
               } else {
                bear.pop();
               }

               bear.unshift(head);

               document.getElementById("ui").innerHTML = 
               "Score: " + score + " | High Score " + highScore;

            if (score > highScore) { 

                highScore = score;
                localStorage.setItem("bearHigh", highScore);
            }

            if (
                head.x < 0 || head.y < 0 ||
                head.x >= 600 || head.y >= 400 ||
                collision(head, bear.slice(1))
            ) {
                running = false;

                document.getElementById("finalScore").innerText = 
                    "Your Score: " + score;

                document.getElementById("gameOverScreen").style.display = "flex";
            }

            if (!running) {
                drawFallingItems();
                requestAnimationFrame(draw);
                return;
            }
        }

        let lastTime = 0;
        function loop(time = 0) {
            if (!running) return;

            const delta = time - lastTime;

            if (delta > Math.max(120 - score * 3, 40)) {

                draw();
                lastTime = time;
            }
            requestAnimationFrame(loop);

            }

        function spawnFallingItem() {

            const isBear = Math.random() < 0.5;

            fallingItems.push({
                x: Math.random() * 600,
                y: -30,
                speed: 2 + Math.random () * 2,
                type: isBear ? "bear" : "honey"
            });
        }

        setInterval (() => {

            if (!running) {
                spawnFallingItem();
            }
        }, 500);
    
        function drawFallingItems() {
            for (let i=0; i < fallingItems.length; i++) {

                let item = fallingItems[i];
                
                item.y += item.speed;

                if(item.type === "bear") {
                    ctx.drawImage(bearImg, item.x, item.y, 40, 40);
                } else {
                    ctx.drawImage(HoneyImg, item.x, item.y, 30, 30);
                }

                if (item.y > 400) {
                    fallingItems.splice(i, 1);
                    i--;
                }
            }

        }

        function titleLoop() {
            if (!running) {
                drawFallingItems();
            }
            requestAnimationFrame(titleLoop);
        }

        titleLoop();
        
        function restartGame() {

            document.getElementById("gameOverScreen").style.display = "none";
            reset();
            running = true;
            loop();
        }


        function startGame() {

            document.getElementById("startScreen").style.display = "none";
            reset();
            running = true;
            document.body.focus();
            loop();
        }
        
    </script>

    </body>

    </html>
